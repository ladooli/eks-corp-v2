apiVersion: v1
kind: ServiceAccount
metadata:
  name: storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
spec:
  replicas: 3
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
    spec:
      serviceAccountName: storage
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: storage
      containers:
      - name: storage
        # Replace <AWS_ACCOUNT_ID> and <RDS_ENDPOINT> at deploy time (see README)
        image: <AWS_ACCOUNT_ID>.dkr.ecr.eu-north-1.amazonaws.com/eks-corp/backend:v2
        ports:
        - containerPort: 3000
        env:
        - name: DB_HOST
          value: <RDS_ENDPOINT>
        - name: DB_NAME
          value: storagedb
        - name: DB_USER
          value: storage_app
        - name: DB_IAM_AUTH
          value: "true"
        - name: AWS_REGION
          value: eu-north-1
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storage-service
spec:
  selector:
    app: storage
  ports:
  - port: 3000
    targetPort: 3000