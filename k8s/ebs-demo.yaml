apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-demo-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: gp3
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebs-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ebs-demo
  template:
    metadata:
      labels:
        app: ebs-demo
    spec:
      containers:
      - name: writer
        image: busybox:1.37
        command:
        - sh
        - -c
        - while true; do echo "$(date -u) written by $HOSTNAME" >> /data/log.txt; sleep 30; done
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ebs-demo-data